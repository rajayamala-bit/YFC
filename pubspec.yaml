name: yfc_app
description: "YFC (Youth For Christ) - Bilingual Youth Fellowship Application & Web Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  image_picker: ^1.2.3
  file_picker: ^8.0.0
  google_generative_ai: ^0.4.0
  photo_view: ^0.14.0
  image_cropper: ^12.2.1
  gal: ^2.3.0
  shared_preferences: ^2.2.2
  video_player: ^2.8.2

  # Native Alarms, Notifications & Audio
  flutter_local_notifications: ^17.0.0
  android_alarm_manager_plus: 5.1.1
  audioplayers: ^6.0.0
  record: ^5.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  wakelock_plus: ^1.2.8
  timezone: ^0.9.4


  # Firebase & Cloud
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  supabase_flutter: ^2.3.4
  http: ^1.6.0
  html_unescape: ^2.0.0

  # Linking & Sharing
  url_launcher: ^6.2.4
  share_plus: ^10.0.0
  any_link_preview: ^3.0.1
  flutter_linkify: ^6.0.0
  receive_sharing_intent: ^1.8.0
  chewie: ^1.13.1
  sqflite: ^2.3.0
  path: ^1.9.0
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqlite3: ^2.4.0
  sqflite_common_ffi: ^2.3.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#8B0000"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/audio/morning_hymn.mp3
    - assets/audio/evening_chimes.mp3
    - assets/images/
    - assets/images/news/
    - assets/images/carousel/
    - assets/videos/
    - assets/video/
    - assets/bible/
    - assets/bible/books/

dependency_overrides:
  record_platform_interface: 1.2.0


